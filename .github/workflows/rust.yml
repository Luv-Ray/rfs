name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Run clippy
      run: cargo clippy --verbose

  miri:
    # Runs the test suite under Miri to catch UB in the `unsafe` blocks
    # (Box::new_zeroed node allocation, zerocopy casts). Miri is slow, so it
    # is a separate job that runs in parallel with `build` rather than
    # blocking the fast build/clippy feedback.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install nightly + Miri
      run: |
        rustup toolchain install nightly --component miri
        rustup override set nightly
        cargo miri setup
    - name: Run tests under Miri
      # -Zmiri-disable-isolation: the image-backed tests do real file I/O
      # (open / pread / pwrite) and read the wall clock for temp paths, which
      # Miri blocks under its default isolation. Disabling isolation lets Miri
      # forward those to the host while still checking memory semantics.
      # --lib: every test is an inline #[cfg(test)] module in the library
      # crate; this skips the fuser-linked binary target.
      # Heavy throughput/stress tests (thousands of inserts) are marked
      # #[cfg_attr(miri, ignore)] so they are skipped here — they exercise no
      # unsafe path the smaller tests don't, and would take ~30 min under Miri
      # vs ~2 min for the rest. Plain `cargo test` still runs them.
      env:
        MIRIFLAGS: -Zmiri-disable-isolation
      run: cargo miri test --lib --verbose

  bench:
    # Compile-check the microbenchmark suite (benches/fs_bench.rs) so it can't
    # silently rot as the Fs API changes. #[bench] requires nightly
    # (#![feature(test)]); the rest of the build is stable.
    #
    # --no-run: build only, never time. CI runners are shared, oversubscribed
    # VMs — their bench numbers swing tens of percent run to run, so they're
    # useless for regression tracking. Real numbers need a dedicated runner;
    # here we only guarantee the suite still compiles.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install nightly
      run: rustup toolchain install nightly
    - name: Compile benches
      run: cargo +nightly bench --no-run --verbose

  fuzz:
    # Differential fuzz of the Fs layer (fuzz/fuzz_targets/fs_ops.rs) against an
    # in-memory oracle: random op sequences run on a real image-backed Fs and a
    # shadow model, checked for agreement after every mutation and again after
    # gc / journal-replay reopen. Ten minutes per run.
    #
    # push-to-main only: a 10-minute job would be a heavy tax on every PR, and
    # fuzzing is a soak test, not a gate. PRs still get build/clippy/test/miri.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install nightly + cargo-fuzz
      run: |
        rustup toolchain install nightly
        rustup override set nightly
        cargo install cargo-fuzz --locked
    # Persist the corpus between runs so coverage accumulates across pushes
    # rather than starting cold every time. Keyed by SHA with a rolling
    # restore so each run seeds from the most recent prior corpus.
    - name: Restore fuzz corpus
      uses: actions/cache@v4
      with:
        path: fuzz/corpus
        key: fuzz-corpus-${{ github.sha }}
        restore-keys: |
          fuzz-corpus-
    - name: Fuzz fs_ops for 10 minutes
      # -max_total_time=600: ten minutes of fuzzing.
      # -timeout=60: flag any single input that hangs for 60s (a livelock in
      # reclaim/gc would otherwise stall the whole run silently).
      run: cargo fuzz run fs_ops -- -max_total_time=600 -timeout=60
    # If the run found a crash, keep the reproducer so it can be replayed
    # locally with `cargo fuzz run fs_ops <artifact>`.
    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-artifacts
        path: fuzz/artifacts
        if-no-files-found: ignore

  mount-smoke:
    # End-to-end smoke tests that drive the real kernel FUSE path
    # (syscall -> VFS -> /dev/fuse -> fuser -> src/fuse.rs -> Fs), which the
    # library-layer `cargo test` and the fuzz target both bypass. This is the
    # only CI coverage of the fuse.rs translation layer, kernel-contract errno
    # mapping (EEXIST / ENOTEMPTY / ENOTDIR), readdir + path resolution, and
    # the cross-process unmount/remount persistence lifecycle. It's fast, so
    # unlike fuzz it gates PRs too.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # fuser 0.17 shells out to `fusermount3` to mount; /dev/fuse is available
    # on GitHub's ubuntu runners, but the fuse3 userspace tools are not
    # installed by default.
    - name: Install FUSE
      run: sudo apt-get update && sudo apt-get install -y fuse3
    - name: Build
      run: cargo build --verbose
    # umask 002 so the perm assertion in mount_smoke.sh (expects 664 for a
    # freshly created file) holds; the runner's default umask is 022 (644).
    - name: Mount smoke test
      run: |
        umask 002
        ./scripts/mount_smoke.sh
    - name: Persistence smoke test
      run: ./scripts/persist_smoke.sh
